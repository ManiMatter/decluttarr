general:
  log_level: INFO
  test_run: true
  timer: 10
  # ignored_download_clients: ["emulerr"]
  # ssl_verification: false # Optional: Defaults to true
  # private_tracker_handling: "obsolete_tag" # remove, skip, obsolete_tag. Optional. Default: remove
  # public_tracker_handling: "remove"  # remove, skip, obsolete_tag. Optional. Default: remove
  # obsolete_tag: "Obsolete" # optional. Default: "Obsolete"
  # protected_tag: "Keep" # optional. Default: "Keep"

job_defaults:
  max_strikes: 3
  min_days_between_searches: 7
  max_concurrent_searches: 3

jobs:
  remove_bad_files:
    # keep_archives: true
  remove_done_seeding:
    # target_tags:
    #   - "Obsolete"
    # target_categories:
    #  - "autobrr"
  remove_failed_downloads:
  remove_failed_imports:
    message_patterns:
      - "Not a Custom Format upgrade for existing*"
      - "Not an upgrade for existing*"
      - "*Found potentially dangerous file with extension*"
      - "Invalid video file*"
      - "No files found are eligible for import*"
      - "One or more episodes expected in this release were not imported or missing from the release"
  remove_metadata_missing:
    # max_strikes: 3
  remove_missing_files:
  remove_orphans:
  remove_slow:
    # min_speed: 100
    # max_strikes: 3
  remove_stalled:
    # max_strikes: 3
  remove_unmonitored:
  search_unmet_cutoff:
    # min_days_between_searches: 7
    # max_concurrent_searches: 3
  search_missing:
    # min_days_between_searches: 7
    # max_concurrent_searches: 3

instances:
  sonarr:
    - base_url: "http://sonarr:8989"
      api_key: "xxxx"
      # Optional: Override job settings for this specific instance
      # Instance-level settings override global job settings
      # jobs:
      #   # Disable a globally-enabled job for this instance
      #   remove_stalled: false
      #
      #   # Override specific parameters while inheriting others from global
      #   remove_slow:
      #     min_speed: 200  # Override min_speed, inherit max_strikes from global
      #
      #   # Enable a job disabled globally, with custom parameters
      #   search_unmet_cutoff:
      #     max_concurrent_searches: 2
      #     min_days_between_searches: 14

  radarr:
    - base_url: "http://radarr:7878"
      api_key: "xxxx"
      # This instance uses all global job settings (no overrides)

    # Example: Second radarr instance (e.g., for 4K content)
    # - base_url: "http://radarr-4k:7878"
    #   api_key: "yyyy"
    #   jobs:
    #     # Different config for 4K instance
    #     search_missing: false  # Don't auto-search on 4K
    #     remove_slow:
    #       min_speed: 500  # Require faster speeds for 4K content

  readarr:
    - base_url: "http://readarr:8787"
      api_key: "xxxx"

  lidarr:
    - base_url: "http://lidarr:8686"
      api_key: "xxxx"

  whisparr:
    - base_url: "http://whisparr:6969"
      api_key: "xxxx"

download_clients:
  qbittorrent:
    - base_url: "http://qbittorrent:8080" # You can use decluttarr without qbit (not all features available, see readme).
      # username: xxxx # (optional -> if not provided, assuming not needed)
      # password: xxxx # (optional -> if not provided, assuming not needed)
      # name: "qBittorrent" # (optional -> if not provided, assuming "qBittorrent". Must correspond with what is specified in your *arr as download client name)
  # sabnzbd:
  #   - base_url: "http://sabnzbd:8080" # SABnzbd server URL
  #     api_key: "your_api_key_here" # (required -> SABnzbd API key)
  #     # name: "SABnzbd" # (optional -> if not provided, assuming "SABnzbd". Must correspond with what is specified in your *arr as download client name)
